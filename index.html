<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Carte de Rouen</title>

  <!-- Leaflet -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <!-- MapLibre GL: necesario para estilos VECTORIALES de MapTiler (tu estilo Inurba) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/maplibre-gl@5.24.0/dist/maplibre-gl.css">
  <!-- Tus estilos -->
  <link rel="stylesheet" href="css/estilo.css">
</head>
<body>
  <div id="map">
    <div class="map-branding" aria-label="Logos de Inurba">
      <img class="rouen-logo" src="img/inurba-rouen-logo-v2.svg" alt="Inurba Rouen">
      <img class="inurba-footer-logo" src="img/Inurba_RGB_Pos_BN.png" alt="Inurba">
    </div>
  </div>

  <!-- Librerías: EL ORDEN IMPORTA (Leaflet → MapLibre → puente → tu código) -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/maplibre-gl@5.24.0/dist/maplibre-gl.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@maplibre/maplibre-gl-leaflet@0.1.4/leaflet-maplibre-gl.js"></script>
  <!-- Tu lógica -->
  <script src="js/mapa.js"></script>
</body>
</html>
